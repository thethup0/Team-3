<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERICA 맛집 티어리스트</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');

:root {
  --ink: #18221f; --muted: #78827d; --line: #e7ece8; --paper: #f7f9f7;
  --green: #176b4b; --green-dark: #10543a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; }
button, input, select, textarea { font: inherit; }
.topbar { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 max(6vw, 24px); background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 900; letter-spacing: .04em; font-size: 14px; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: white; background: var(--green); }
.top-note { color: var(--muted); font-size: 12px; }
.container { width: min(1080px, 88%); margin: 0 auto; }
.hero { padding: 76px 0 48px; }
.eyebrow { margin: 0 0 12px; color: var(--green); font-size: 10px; font-weight: 900; letter-spacing: .16em; }
.hero h1 { margin: 0; font-size: clamp(38px, 6vw, 66px); line-height: 1.18; letter-spacing: -.06em; }
.hero h1 span { color: var(--green); }
.hero-copy { margin: 18px 0 26px; color: var(--muted); font-size: 14px; }
.primary-btn { border: 0; border-radius: 10px; padding: 13px 20px; color: #fff; background: var(--green); font-weight: 800; cursor: pointer; transition: .2s; }
.primary-btn:hover { background: var(--green-dark); transform: translateY(-1px); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 72px; }
.stat-card { padding: 20px 22px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.stat-card span { display: block; color: var(--muted); font-size: 12px; }
.stat-card strong { display: block; margin-top: 8px; font-size: 28px; letter-spacing: -.04em; }
.toolbar { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; }
.toolbar h2 { margin: 0; font-size: 27px; letter-spacing: -.05em; }
.filters { display: flex; gap: 8px; }
.filters input, .filters select { min-width: 150px; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; background: #fff; outline-color: var(--green); font-size: 12px; }
.tier-board { display: grid; gap: 12px; }
.tier-row { display: grid; grid-template-columns: 100px 1fr; min-height: 112px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
.tier-label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #fff; }
.tier-label strong { font-size: 29px; line-height: 1; }
.tier-label span { font-size: 10px; opacity: .9; }
.tier-S .tier-label { background: #e2a52b; } .tier-A .tier-label { background: #2479bd; }
.tier-B .tier-label { background: #39956c; } .tier-C .tier-label { background: #7c8791; }
.tier-D .tier-label { background: #a66d66; }
.tier-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-content: center; gap: 10px; padding: 14px; }
.empty-tier { align-self: center; color: #a0aaa4; font-size: 12px; }
.restaurant-card { display: flex; justify-content: space-between; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: #fbfcfb; }
.card-main { min-width: 0; }
.card-title-line { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.restaurant-name { margin: 0; font-size: 14px; }
.category-tag { padding: 3px 7px; border-radius: 20px; background: #edf4ef; color: var(--green); font-size: 9px; font-weight: 700; }
.restaurant-meta, .restaurant-memo { margin: 7px 0 0; color: var(--muted); font-size: 10px; }
.restaurant-memo { color: #4e5b54; line-height: 1.5; }
.card-bottom { display: flex; gap: 10px; margin-top: 10px; font-size: 10px; }
.rating { color: #d69a20; } .price { color: var(--muted); }
.card-controls { display: flex; flex-direction: column; align-items: end; justify-content: space-between; flex-shrink: 0; }
.tier-select-label { color: var(--muted); font-size: 9px; text-align: right; }
.tier-select { display: block; margin-top: 4px; border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; background: #fff; color: var(--ink); font-weight: 800; }
.delete-btn { border: 0; padding: 4px 0; color: #a66d66; background: transparent; font-size: 10px; cursor: pointer; }
.footnote { margin: 22px 0 80px; color: #9aa39d; font-size: 10px; }
dialog { width: min(520px, calc(100% - 28px)); max-height: 90vh; padding: 0; border: 0; border-radius: 18px; box-shadow: 0 20px 80px #10251c30; }
dialog::backdrop { background: #14251dcc; backdrop-filter: blur(3px); }
.form-card { display: grid; gap: 15px; padding: 26px; }
.form-heading { display: flex; justify-content: space-between; align-items: start; margin-bottom: 4px; }
.form-heading h2 { margin: 0; font-size: 24px; }
.icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.form-card label { display: grid; gap: 7px; color: #4c5952; font-size: 11px; font-weight: 700; }
.form-card input, .form-card select, .form-card textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 11px; background: #fbfcfb; color: var(--ink); outline-color: var(--green); font-size: 12px; }
.form-card textarea { resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; justify-content: end; gap: 8px; margin-top: 5px; }
.secondary-btn { border: 1px solid var(--line); border-radius: 9px; padding: 12px 17px; background: #fff; cursor: pointer; }
footer { display: flex; justify-content: space-between; padding: 25px 6vw; border-top: 1px solid var(--line); color: var(--green); font-size: 10px; font-weight: 900; letter-spacing: .08em; }
footer span { color: #9aa39d; font-weight: 400; letter-spacing: 0; }
@media (max-width: 650px) {
  .topbar { height: 60px; } .top-note { display: none; }
  .hero { padding: 55px 0 36px; } .stats { gap: 8px; margin-bottom: 52px; }
  .stat-card { padding: 14px 12px; } .stat-card strong { font-size: 23px; }
  .toolbar { align-items: start; flex-direction: column; } .filters { width: 100%; }
  .filters input { flex: 1; min-width: 0; } .filters select { min-width: 105px; }
  .tier-row { grid-template-columns: 66px 1fr; }
  .tier-label strong { font-size: 24px; } .tier-content { grid-template-columns: 1fr; padding: 9px; }
  .restaurant-card { padding: 11px; } .form-grid { grid-template-columns: 1fr; }
  footer { gap: 10px; flex-direction: column; }
}

.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.restaurant-card { align-items: stretch; }
.restaurant-photo { width: 88px; min-width: 88px; height: 100px; object-fit: cover; border-radius: 8px; background: #edf1ed; }
.card-main { flex: 1; }
.map-link { display: inline-block; margin-top: 8px; color: var(--green); font-size: 10px; font-weight: 700; text-decoration: none; }
.map-link:hover { text-decoration: underline; }
@media (max-width: 650px) {
  .restaurant-photo { width: 68px; min-width: 68px; height: 84px; }
}

</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark">T</span> ERICA FOOD TIER</a>
    <span class="top-note">안산 · 한양대 ERICA 맛집 아카이브</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">YOUR LOCAL FOOD GUIDE</p>
      <h1>우리 동네 맛집,<br><span>티어로 정리하다.</span></h1>
      <p class="hero-copy">직접 방문한 맛집을 추가하고 나만의 기준으로 평가해 보세요.</p>
      <div class="hero-actions">
        <button class="primary-btn" id="openFormBtn">＋ 맛집 추가하기</button>
        <button class="secondary-btn" id="resetDemoBtn" type="button">초기 목록 복원</button>
      </div>
    </section>

    <section class="stats" aria-label="맛집 통계">
      <div class="stat-card"><span>등록된 맛집</span><strong id="totalCount">0</strong></div>
      <div class="stat-card"><span>최고 등급</span><strong id="topCount">0</strong></div>
      <div class="stat-card"><span>평균 별점</span><strong id="avgRating">-</strong></div>
    </section>

    <section class="toolbar">
      <div>
        <p class="eyebrow">TIER BOARD</p>
        <h2>맛집 티어표</h2>
      </div>
      <div class="filters">
        <input id="searchInput" type="search" placeholder="맛집 이름 검색" aria-label="맛집 이름 검색">
        <select id="categoryFilter" aria-label="음식 종류 필터">
          <option value="전체">전체 종류</option>
          <option>한식</option><option>중식</option><option>일식</option>
          <option>양식</option><option>분식</option><option>카페</option><option>기타</option>
        </select>
      </div>
    </section>

    <section id="tierBoard" class="tier-board"></section>
    <p class="footnote">※ 처음에는 빈 티어표로 시작합니다. 방문한 맛집을 직접 등록해 보세요.</p>
  </main>

  <dialog id="restaurantDialog">
    <form id="restaurantForm" class="form-card">
      <div class="form-heading">
        <div><p class="eyebrow">ADD A RESTAURANT</p><h2>맛집 등록하기</h2></div>
        <button type="button" class="icon-btn" id="closeFormBtn" aria-label="닫기">✕</button>
      </div>
      <label>맛집 이름<input name="name" required maxlength="40" placeholder="예: 내가 좋아하는 식당"></label>
      <div class="form-grid">
        <label>음식 종류
          <select name="category" required>
            <option value="한식">한식</option><option value="중식">중식</option>
            <option value="일식">일식</option><option value="양식">양식</option>
            <option value="분식">분식</option><option value="카페">카페</option><option value="기타">기타</option>
          </select>
        </label>
        <label>티어
          <select name="tier" required>
            <option value="S">S · 인생 맛집</option><option value="A">A · 추천</option>
            <option value="B" selected>B · 무난</option><option value="C">C · 아쉬움</option>
            <option value="D">D · 비추천</option>
          </select>
        </label>
      </div>
      <div class="form-grid">
        <label>별점
          <select name="rating"><option value="5">★★★★★ 5점</option><option value="4">★★★★☆ 4점</option><option value="3" selected>★★★☆☆ 3점</option><option value="2">★★☆☆☆ 2점</option><option value="1">★☆☆☆☆ 1점</option></select>
        </label>
        <label>가격대<input name="price" maxlength="30" placeholder="예: 1인 10,000원"></label>
      </div>
      <label>위치<input name="location" maxlength="60" placeholder="예: 한양대 ERICA 정문 근처"></label>
      <label>한 줄 평가<textarea name="memo" rows="3" maxlength="160" placeholder="어떤 점이 좋았거나 아쉬웠나요?"></textarea></label>
      <div class="form-actions"><button type="button" class="secondary-btn" id="cancelFormBtn">취소</button><button class="primary-btn" type="submit">등록하기</button></div>
    </form>
  </dialog>

  <template id="restaurantTemplate">
    <article class="restaurant-card">
      <img class="restaurant-photo" src="" alt="음식 사진">
      <div class="card-main">
        <div class="card-title-line"><h3 class="restaurant-name"></h3><span class="category-tag"></span></div>
        <p class="restaurant-meta"></p>
        <p class="restaurant-memo"></p>
        <div class="card-bottom"><span class="rating"></span><span class="price"></span></div>
        <a class="map-link" href="#" target="_blank" rel="noopener noreferrer">지도에서 보기</a>
      </div>
      <div class="card-controls">
        <label class="tier-select-label">티어 변경
          <select class="tier-select" aria-label="티어 변경">
            <option value="S">S</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
          </select>
        </label>
        <button class="delete-btn" type="button">삭제</button>
      </div>
    </article>
  </template>

  <footer>ERICA FOOD TIER LIST <span>나만의 맛집 지도를 만들어 보세요.</span></footer>
  <script>
const tiers = [
  { id: "S", title: "인생 맛집" },
  { id: "A", title: "추천 맛집" },
  { id: "B", title: "무난한 맛집" },
  { id: "C", title: "조금 아쉬움" },
  { id: "D", title: "재방문은 고민" }
];

const STORAGE_KEY = "erica-food-tier-list-v1";

// 주변 음식점의 상호·주소는 검색으로 확인한 초기 목록입니다.
// 티어 B는 실제 맛 평가가 아닌 임시 배치이며, 사용자가 직접 변경할 수 있습니다.
const starterRestaurants = [
  { id: "starter-1", name: "도스마스", category: "기타", tier: "B", rating: 0, price: "", location: "안산시 상록구 사동", memo: "초기 등록 예시 · 방문 후 티어를 직접 평가해 보세요." },
  { id: "starter-2", name: "자이카", category: "기타", tier: "B", rating: 0, price: "", location: "안산시 상록구 한양대학로 45-1, 2층", memo: "인도 음식점 · 초기 등록 예시" },
  { id: "starter-3", name: "인더비엣 안산한양대에리카점", category: "기타", tier: "B", rating: 0, price: "", location: "안산시 상록구 성안길 78-3", memo: "베트남 음식점 · 초기 등록 예시" },
  { id: "starter-4", name: "동아리식당", category: "한식", tier: "B", rating: 0, price: "", location: "안산시 상록구 학사2길 13", memo: "초기 등록 예시 · 방문 후 티어를 직접 평가해 보세요." },
  { id: "starter-5", name: "MEAL PLAN B", category: "기타", tier: "B", rating: 0, price: "", location: "안산시 상록구 학사2길 11-1", memo: "부리토 음식점 · 초기 등록 예시" },
  { id: "starter-6", name: "백소정 안산한양대점", category: "일식", tier: "B", rating: 0, price: "", location: "안산시 상록구 한양대학로 60", memo: "초기 등록 예시 · 방문 후 티어를 직접 평가해 보세요." },
  { id: "starter-7", name: "뉴욕버거 한양대에리카점", category: "양식", tier: "B", rating: 0, price: "", location: "안산시 상록구 한양대학로 55", memo: "학생복지관 2층 · 초기 등록 예시" },
  { id: "starter-8", name: "남월 쌀국수 안산한양대 본점", category: "기타", tier: "B", rating: 0, price: "", location: "안산시 상록구 성안길 81, 101호", memo: "베트남 음식점 · 초기 등록 예시" },
  { id: "starter-9", name: "쓰리파스타 한양대에리카점", category: "양식", tier: "B", rating: 0, price: "", location: "안산시 상록구 성안길 84-1", memo: "파스타·피자 음식점 · 초기 등록 예시" }
];

const categoryPhotos = {
  "한식": "https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=500&q=80",
  "중식": "https://images.unsplash.com/photo-1563245372-f21724e3856d?w=500&q=80",
  "일식": "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500&q=80",
  "양식": "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500&q=80",
  "분식": "https://images.unsplash.com/photo-1635363638580-c2809d049eee?w=500&q=80",
  "카페": "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500&q=80",
  "기타": "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80"
};
categoryPhotos["한식"] = "https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=500&q=80";

let restaurants;
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  restaurants = saved === null ? [...starterRestaurants] : JSON.parse(saved);
} catch {
  restaurants = [...starterRestaurants];
}

const board = document.getElementById("tierBoard");
const dialog = document.getElementById("restaurantDialog");
const form = document.getElementById("restaurantForm");
const template = document.getElementById("restaurantTemplate");

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(restaurants));
  } catch (error) {
    console.warn("브라우저 저장소를 사용할 수 없습니다.", error);
  }
  render();
}

function createRestaurantId() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") {
    return window.crypto.randomUUID();
  }
  return "restaurant-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}
function stars(n) {
  return Number(n) > 0 ? "내 별점 " + "★".repeat(Number(n)) + "☆".repeat(5 - Number(n)) : "내 별점 미등록";
}

function render() {
  board.innerHTML = "";
  const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
  const category = document.getElementById("categoryFilter").value;
  const filtered = restaurants.filter(r =>
    r.name.toLowerCase().includes(keyword) &&
    (category === "전체" || r.category === category)
  );

  tiers.forEach(tier => {
    const row = document.createElement("section");
    row.className = `tier-row tier-${tier.id}`;
    row.innerHTML = `<div class="tier-label"><strong>${tier.id}</strong><span>${tier.title}</span></div><div class="tier-content"></div>`;
    const content = row.querySelector(".tier-content");
    const items = filtered.filter(r => r.tier === tier.id);

    if (items.length === 0) {
      const empty = document.createElement("span");
      empty.className = "empty-tier";
      empty.textContent = "아직 등록된 맛집이 없어요.";
      content.appendChild(empty);
    } else {
      items.forEach(item => {
        const card = template.content.firstElementChild.cloneNode(true);
        card.querySelector(".restaurant-photo").src = categoryPhotos[item.category] || categoryPhotos["기타"];
        card.querySelector(".restaurant-photo").alt = item.category + " 음식 사진";
        card.querySelector(".restaurant-name").textContent = item.name;
        card.querySelector(".category-tag").textContent = item.category;
        card.querySelector(".restaurant-meta").textContent =
          [item.location, item.price].filter(Boolean).join(" · ") || "위치 및 가격 정보 없음";
        card.querySelector(".restaurant-memo").textContent = item.memo || "아직 한 줄 평가가 없습니다.";
        card.querySelector(".rating").textContent = stars(item.rating);
        card.querySelector(".price").textContent = "";
        const mapLink = card.querySelector(".map-link");
        mapLink.href = "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(item.name + " " + (item.location || "안산 한양대 ERICA"));
        const select = card.querySelector(".tier-select");
        select.value = item.tier;
        select.addEventListener("change", () => {
          item.tier = select.value;
          save();
        });
        card.querySelector(".delete-btn").addEventListener("click", () => {
          if (confirm(`'${item.name}' 맛집을 삭제할까요?`)) {
            restaurants = restaurants.filter(r => r.id !== item.id);
            save();
          }
        });
        content.appendChild(card);
      });
    }
    board.appendChild(row);
  });

  document.getElementById("totalCount").textContent = restaurants.length;
  document.getElementById("topCount").textContent = restaurants.filter(r => r.tier === "S").length;
  const rated = restaurants.filter(r => Number(r.rating) > 0);
  const average = rated.length
    ? (rated.reduce((sum, r) => sum + Number(r.rating), 0) / rated.length).toFixed(1)
    : "-";
  document.getElementById("avgRating").textContent = average;
}

document.getElementById("openFormBtn").addEventListener("click", () => dialog.showModal());
function closeDialog() { dialog.close(); form.reset(); }
document.getElementById("closeFormBtn").addEventListener("click", closeDialog);
document.getElementById("cancelFormBtn").addEventListener("click", closeDialog);

form.addEventListener("submit", event => {
  event.preventDefault();
  const data = new FormData(form);
  restaurants.push({
    id: createRestaurantId(),
    name: data.get("name").trim(),
    category: data.get("category"),
    tier: data.get("tier"),
    rating: Number(data.get("rating")),
    price: data.get("price").trim(),
    location: data.get("location").trim(),
    memo: data.get("memo").trim()
  });
  save();
  closeDialog();
});

document.getElementById("resetDemoBtn").addEventListener("click", () => {
  if (confirm("초기 맛집 목록으로 복원할까요? 현재 직접 추가한 내용은 사라집니다.")) {
    restaurants = [...starterRestaurants];
    save();
  }
});
document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("categoryFilter").addEventListener("change", render);
render();

</script>
</body>
</html>
